name: Python quality and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt
            frontend/requirements.txt
            constraints-security.txt
            requirements-linux-py314.in
            requirements-linux-py314.txt
      - name: Install application and scanners
        run: python -m pip install --require-hashes -r requirements-linux-py314.txt
      - name: Verify installed lock matches repository inputs
        run: python -m pip check
      - name: Unit tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m unittest discover -s tests -v
      - name: Compile and dependency consistency
        run: |
          python -m compileall -q backend frontend tests
          python -m pip check
      - name: Dependency advisories
        run: pip-audit --local
      - name: Python security lint
        run: bandit -r backend frontend -ll
      - name: Static correctness checks
        run: ruff check --select E4,E7,E9,F backend frontend tests
      - name: Whitespace and patch validation
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check "HEAD^" HEAD
          fi
      - name: Offline recommendation evaluation
        run: |
          mkdir -p artifacts
          python -m backend.services.offline_evaluation --labels docs/recommendation-labels.csv --output artifacts/recommendation-evaluation.json --k 5
